webcam_node:
  ros__parameters:
    cameras:
      - id: 1
        name: "front"
        width: 1280
        height: 720
        fps: 30
        serial_number: ""   # udevadm info /dev/video0 | grep ID_SERIAL_SHORT
        power_line_frequency: 2  # 0: disabled, 1: 50Hz, 2: 60Hz
      - id: 3
        name: "side"
        width: 1280
        height: 720
        fps: 30
        serial_number: ""   # udevadm info /dev/video1 | grep ID_SERIAL_SHORT
        power_line_frequency: 2  # 0: disabled, 1: 50Hz, 2: 60Hz
